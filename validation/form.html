<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
           text-align: center;

        }
        #Container{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #form{
            margin-top: 10px;
            height: 500px;
            width: 500px;
           
            border-radius: 10px;
            border: 2px,black,solid;
            /*box-shadow: 10px 5px 5px rgba(0, 0, 0, 0.15); */
            transition-duration: 4s;

        }
      
        
    </style>
</head>
<body>
    <h1>
        Registration Form 
    </h1>
    <div id="Container">
        <div id="form">
            <div>
                <label for="name">Name :</label>

            <input id="name" type="text" placeholder="rishank..">

            </div>
            <div>
                <label for="email" >Email :</label>
                <input id="email" type="email" placeholder="rish..@gmail.com">
            </div>
            <div>
                <label for="mobile">Mob :</label>
                <input id="mobile" type="mobile" placeholder="9233888...">
            </div>
            <div>
                <label for="pass">Password :</label>
                <input id="pass" type="password">
            </div>
            <div>
                <label for="re-pass">RE-Password :</label>
                <input id="re-pass" type="password">
            </div>
            <div>
                <button>Register</button>
            </div>
        

           
        </div>
        
    </div>
    
</body>
</html>
